<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Costlytics — Service Detail</title>
  </head>
  <body>
    <div id="app">
      <header class="app-header">
        <h1>Costlytics</h1>
        <nav class="app-nav">
          <a href="/">Overview</a>
          <a href="/explorer.html">Cost Explorer</a>
          <a href="/service-detail.html" class="active">Service Detail</a>
          <a href="/account-detail.html">Account Detail</a>
          <a href="/cost-changes.html">Cost Changes</a>
          <a href="/data-sources.html">Data Sources</a>
          <a href="/tags.html">Tags</a>
        </nav>
        <div class="controls">
          <label class="control">
            <span>Source</span>
            <select id="source-picker">
              <option value="" selected>Loading sources&hellip;</option>
            </select>
          </label>
          <label class="control">
            <span>Service</span>
            <select id="service-picker">
              <option value="" selected>Select a service&hellip;</option>
            </select>
          </label>
          <label class="control">
            <span>From</span>
            <input type="date" id="date-start" />
          </label>
          <label class="control">
            <span>To</span>
            <input type="date" id="date-end" />
          </label>
          <label class="control">
            <span>Metric</span>
            <select id="metric-select">
              <option value="amortized" selected>Amortized</option>
              <option value="billed">Billed</option>
              <option value="list">List</option>
              <option value="contracted">Contracted</option>
            </select>
          </label>
        </div>
      </header>
      <div class="status-bar" id="status-bar">
        <span class="status-item" id="status-range"></span>
        <span class="status-sep">&middot;</span>
        <span class="status-item" id="status-metric"></span>
        <span class="status-sep">&middot;</span>
        <span class="status-item" id="status-currency">Currency: &hellip;</span>
        <span class="status-loading" id="status-loading" hidden>Loading&hellip;</span>
      </div>
      <main>
        <div class="table-status" id="service-detail-placeholder">Select a service to view details.</div>
        <div id="service-kpi"></div>
        <div id="service-trend"></div>
        <div id="service-by-account"></div>
        <div id="service-by-region"></div>
        <div id="service-by-category"></div>
        <div id="service-top-resources"></div>
      </main>
    </div>
    <script type="module" src="/src/serviceDetailMain.ts"></script>
  </body>
</html>
