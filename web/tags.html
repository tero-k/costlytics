<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Costlytics — Tags</title>
  </head>
  <body>
    <!-- Sidebar, header, shared Source/From/To/Metric controls and status bar are rendered by src/shared/appShell.ts. -->
    <div id="app" data-page="tags">
      <div class="controls page-controls">
        <label class="control">
          <span>Tag key</span>
          <select id="tag-key-picker">
            <option value="" selected>Select a tag key&hellip;</option>
          </select>
        </label>
        <label class="control">
          <span>Tag value</span>
          <select id="tag-value-picker">
            <option value="" selected>Select a tag value&hellip;</option>
          </select>
        </label>
      </div>
      <main>
        <div class="table-status" id="tags-placeholder">Select a tag key and value to view details.</div>
        <div id="tags-kpi"></div>
        <div id="tags-trend"></div>
        <div id="tags-by-service"></div>
        <div id="tags-by-account"></div>
        <div id="tags-by-region"></div>
        <div id="tags-top-resources"></div>
      </main>
    </div>
    <script type="module" src="/src/tagsMain.ts"></script>
  </body>
</html>
