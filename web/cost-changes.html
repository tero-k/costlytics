<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Costlytics — Cost Changes</title>
  </head>
  <body>
    <!-- Sidebar, header, shared Source/From/To/Metric controls and status bar are rendered by src/shared/appShell.ts. -->
    <div id="app" data-page="cost-changes" data-from-label="Current from" data-to-label="Current to">
      <div class="controls page-controls">
        <label class="control">
          <span>Previous from</span>
          <input type="date" id="prev-date-start" />
        </label>
        <label class="control">
          <span>Previous to</span>
          <input type="date" id="prev-date-end" />
        </label>
        <label class="control">
          <span>Group by</span>
          <select id="dimension-select">
            <option value="service" selected>Service</option>
            <option value="account">Account</option>
            <option value="region">Region</option>
            <option value="availability_zone">Availability zone</option>
            <option value="charge_category">Charge category</option>
            <option value="pricing_category">Pricing category</option>
            <option value="resource">Resource</option>
          </select>
        </label>
        <label class="control">
          <span>Top N</span>
          <input type="number" id="top-n-input" min="1" max="50" value="10" />
        </label>
      </div>
      <main>
        <div id="changes-summary"></div>
        <div id="changes-movers"></div>
        <section class="chart-section card">
          <div class="chart-header">
            <h2>Comparison detail</h2>
            <button type="button" id="csv-export-btn">Export CSV</button>
          </div>
          <div id="changes-table"></div>
        </section>
      </main>
    </div>
    <script type="module" src="/src/costChangesMain.ts"></script>
  </body>
</html>
