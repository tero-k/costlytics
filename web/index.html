<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Costlytics</title>
  </head>
  <body>
    <!-- Sidebar, header, shared Source/From/To/Metric controls and status bar are rendered by src/shared/appShell.ts. -->
    <div id="app" data-page="overview">
      <main>
        <section class="empty-state" id="no-sources" hidden>
          <h2>No data sources yet</h2>
          <p>Add an S3 bucket or a local folder with FOCUS / CUR exports to start exploring costs.</p>
          <a class="button-primary" href="/settings.html">Open Settings</a>
        </section>
        <section class="empty-state" id="no-sources-configured" hidden>
          <h2>None of your data sources could be loaded</h2>
          <p>Check Settings for details.</p>
          <a class="button-primary" href="/settings.html">Open Settings</a>
        </section>
        <div id="overview"></div>
        <section class="chart-section card">
          <div class="chart-header">
            <h2>Cost trend</h2>
            <div class="chart-tools">
              <div class="segmented" id="trend-chart-type" role="group" aria-label="Chart type">
                <button type="button" class="active" data-chart-type="line">Line</button>
                <button type="button" data-chart-type="bar">Bar</button>
              </div>
              <label class="control control-inline">
                <span>Granularity</span>
                <select id="granularity-select">
                  <option value="auto" selected>Auto</option>
                  <option value="day">Day</option>
                  <option value="month">Month</option>
                  <option value="year">Year</option>
                </select>
              </label>
            </div>
          </div>
          <div class="chart-area" id="trend-chart"></div>
        </section>
        <section class="top-breakdown-grid">
          <div class="chart-section card">
            <div class="chart-header">
              <h2>Top services</h2>
            </div>
            <div class="chart-area" id="top-services"></div>
          </div>
          <div class="chart-section card">
            <div class="chart-header">
              <h2>Top accounts</h2>
            </div>
            <div class="chart-area" id="top-accounts"></div>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
