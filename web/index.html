<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Costlytics</title>
  </head>
  <body>
    <div id="app">
      <header class="app-header">
        <h1>Costlytics</h1>
        <nav class="app-nav">
          <a href="/" class="active">Overview</a>
          <a href="/explorer.html">Cost Explorer</a>
          <a href="/service-detail.html">Service Detail</a>
          <a href="/account-detail.html">Account Detail</a>
          <a href="/cost-changes.html">Cost Changes</a>
        </nav>
        <div class="controls">
          <label class="control">
            <span>From</span>
            <input type="date" id="date-start" />
          </label>
          <label class="control">
            <span>To</span>
            <input type="date" id="date-end" />
          </label>
          <label class="control">
            <span>Metric</span>
            <select id="metric-select">
              <option value="amortized" selected>Amortized</option>
              <option value="billed">Billed</option>
              <option value="list">List</option>
              <option value="contracted">Contracted</option>
            </select>
          </label>
        </div>
      </header>
      <div class="status-bar" id="status-bar">
        <span class="status-item" id="status-range"></span>
        <span class="status-sep">&middot;</span>
        <span class="status-item" id="status-metric"></span>
        <span class="status-sep">&middot;</span>
        <span class="status-item" id="status-currency">Currency: &hellip;</span>
        <span class="status-loading" id="status-loading" hidden>Loading&hellip;</span>
      </div>
      <main>
        <div id="overview"></div>
        <section class="chart-section">
          <div class="chart-header">
            <h2>Cost trend</h2>
            <label class="control">
              <span>Granularity</span>
              <select id="granularity-select">
                <option value="auto" selected>Auto</option>
                <option value="day">Day</option>
                <option value="month">Month</option>
                <option value="year">Year</option>
              </select>
            </label>
          </div>
          <div class="chart-area" id="trend-chart"></div>
        </section>
        <section class="top-breakdown-grid">
          <div class="chart-section">
            <div class="chart-header">
              <h2>Top services</h2>
            </div>
            <div class="chart-area" id="top-services"></div>
          </div>
          <div class="chart-section">
            <div class="chart-header">
              <h2>Top accounts</h2>
            </div>
            <div class="chart-area" id="top-accounts"></div>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
