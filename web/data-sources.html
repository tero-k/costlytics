<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Costlytics — Data Sources</title>
  </head>
  <body>
    <div id="app">
      <header class="app-header">
        <h1>Costlytics</h1>
        <nav class="app-nav">
          <a href="/">Overview</a>
          <a href="/explorer.html">Cost Explorer</a>
          <a href="/service-detail.html">Service Detail</a>
          <a href="/account-detail.html">Account Detail</a>
          <a href="/cost-changes.html">Cost Changes</a>
          <a href="/data-sources.html" class="active">Data Sources</a>
          <a href="/tags.html">Tags</a>
        </nav>
        <div class="controls">
          <label class="control">
            <span>Source</span>
            <select id="source-picker">
              <option value="" selected>Loading sources&hellip;</option>
            </select>
          </label>
        </div>
      </header>
      <div class="status-bar" id="status-bar">
        <span class="status-item" id="status-source-count"></span>
        <span class="status-loading" id="status-loading" hidden>Loading&hellip;</span>
      </div>
      <main>
        <section class="chart-section">
          <div class="chart-header">
            <h2>Configured sources</h2>
          </div>
          <div id="data-sources-table"></div>
        </section>
      </main>
    </div>
    <script type="module" src="/src/dataSourcesMain.ts"></script>
  </body>
</html>
