<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Costlytics — Cost Explorer</title>
  </head>
  <body>
    <!-- Sidebar, header, shared Source/From/To/Metric controls and status bar are rendered by src/shared/appShell.ts. -->
    <div id="app" data-page="explorer">
      <div class="controls page-controls">
        <label class="control">
          <span>Group by</span>
          <select id="dimension-select">
            <option value="service" selected>Service</option>
            <option value="account">Account</option>
            <option value="region">Region</option>
            <option value="availability_zone">Availability zone</option>
            <option value="charge_category">Charge category</option>
            <option value="pricing_category">Pricing category</option>
            <option value="resource">Resource</option>
          </select>
        </label>
        <label class="control">
          <span>Top N</span>
          <input type="number" id="top-n-input" min="1" max="50" value="10" />
        </label>
      </div>
      <main>
        <section class="chart-section card">
          <div class="chart-header">
            <h2>Cost trend</h2>
            <div class="segmented" id="explorer-chart-type" role="group" aria-label="Chart type">
              <button type="button" class="active" data-chart-type="line">Area</button>
              <button type="button" data-chart-type="bar">Bar</button>
            </div>
          </div>
          <div class="chart-area" id="explorer-trend"></div>
        </section>
        <section class="chart-section card">
          <div class="chart-header">
            <h2>Breakdown</h2>
            <button type="button" id="csv-export-btn">Export CSV</button>
          </div>
          <div id="explorer-table"></div>
        </section>
      </main>
    </div>
    <script type="module" src="/src/explorerMain.ts"></script>
  </body>
</html>
