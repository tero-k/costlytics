<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Costlytics — Cost Explorer</title>
  </head>
  <body>
    <div id="app">
      <header class="app-header">
        <h1>Costlytics</h1>
        <nav class="app-nav">
          <a href="/">Overview</a>
          <a href="/explorer.html" class="active">Cost Explorer</a>
          <a href="/service-detail.html">Service Detail</a>
          <a href="/account-detail.html">Account Detail</a>
        </nav>
        <div class="controls">
          <label class="control">
            <span>From</span>
            <input type="date" id="date-start" />
          </label>
          <label class="control">
            <span>To</span>
            <input type="date" id="date-end" />
          </label>
          <label class="control">
            <span>Metric</span>
            <select id="metric-select">
              <option value="amortized" selected>Amortized</option>
              <option value="billed">Billed</option>
              <option value="list">List</option>
              <option value="contracted">Contracted</option>
            </select>
          </label>
          <label class="control">
            <span>Group by</span>
            <select id="dimension-select">
              <option value="service" selected>Service</option>
              <option value="account">Account</option>
              <option value="region">Region</option>
              <option value="availability_zone">Availability zone</option>
              <option value="charge_category">Charge category</option>
              <option value="pricing_category">Pricing category</option>
              <option value="resource">Resource</option>
            </select>
          </label>
          <label class="control">
            <span>Top N</span>
            <input type="number" id="top-n-input" min="1" max="50" value="10" />
          </label>
        </div>
      </header>
      <div class="status-bar" id="status-bar">
        <span class="status-item" id="status-range"></span>
        <span class="status-sep">&middot;</span>
        <span class="status-item" id="status-metric"></span>
        <span class="status-sep">&middot;</span>
        <span class="status-item" id="status-currency">Currency: &hellip;</span>
        <span class="status-loading" id="status-loading" hidden>Loading&hellip;</span>
      </div>
      <main>
        <section class="chart-section">
          <div class="chart-header">
            <h2>Cost trend</h2>
          </div>
          <div class="chart-area" id="explorer-trend"></div>
        </section>
        <section class="chart-section">
          <div class="chart-header">
            <h2>Breakdown</h2>
            <button type="button" id="csv-export-btn">Export CSV</button>
          </div>
          <div id="explorer-table"></div>
        </section>
      </main>
    </div>
    <script type="module" src="/src/explorerMain.ts"></script>
  </body>
</html>
