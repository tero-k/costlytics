<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Costlytics — Account Detail</title>
  </head>
  <body>
    <!-- Sidebar, header, shared Source/From/To/Metric controls and status bar are rendered by src/shared/appShell.ts. -->
    <div id="app" data-page="account-detail">
      <div class="controls page-controls">
        <label class="control">
          <span>Account</span>
          <select id="account-picker">
            <option value="" selected>Select an account&hellip;</option>
          </select>
        </label>
      </div>
      <main>
        <div class="table-status" id="account-detail-placeholder">Select an account to view details.</div>
        <div id="account-kpi"></div>
        <div id="account-trend"></div>
        <div id="account-by-service"></div>
        <div id="account-by-region"></div>
        <div id="account-top-resources"></div>
      </main>
    </div>
    <script type="module" src="/src/accountDetailMain.ts"></script>
  </body>
</html>
