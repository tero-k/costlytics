[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/data",
    "crates/api",
    "crates/service",
    "crates/app",
]
# `cargo test`/`cargo build` at the root skip the Tauri app (slow, needs
# WebView toolchains); use `cargo test --workspace` or `cargo tauri dev`.
default-members = ["crates/domain", "crates/data", "crates/service", "crates/api"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/tero-k/costlytics"

[workspace.dependencies]
