[package]
name = "data"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "generate-fixtures"
path = "src/bin/generate_fixtures.rs"

[dependencies]
domain = { path = "../domain" }
duckdb = { version = "1", features = ["bundled", "r2d2"] }
r2d2 = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
