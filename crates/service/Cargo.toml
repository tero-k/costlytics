[package]
name = "service"
version = "0.1.0"
edition = "2021"

[dependencies]
domain = { path = "../domain" }
data = { path = "../data" }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
